    <script>
      // Gracefully ignore benign Vite HMR WebSocket connection closures in preview iframe
      window.addEventListener('error', function(e) {
        if (e && e.message && (e.message.includes('WebSocket') || e.message.includes('vite'))) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (e.reason.message || String(e.reason)).includes('WebSocket')) {
          e.preventDefault();
        }
      });
    </script>
